server {
    listen 80;
    listen [::]:80;
    server_name study.kaidevlab.com;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location / {
        return 301 https://study.kaidevlab.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name study.kaidevlab.com;
    root /var/www/kaidevlab/out;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/learn.kaidevlab.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/learn.kaidevlab.com/privkey.pem;

    server_tokens off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml application/xml+rss image/svg+xml;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location /_next/static/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /images/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }

    location ~* \.(ico|png|svg|webmanifest|xml|txt|webp|jpg|jpeg)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }

    # On study.kaidevlab.com, root / directly serves the Study Hub!
    location = / {
        try_files /learn/index.html =404;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/index.html $uri.html =404;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    client_max_body_size 10M;
}
